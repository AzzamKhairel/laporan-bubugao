<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Laporan Presensi - Log History</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { background-color: #f3f4f6; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-6xl mx-auto flex flex-col gap-6">
    
    <!-- HEADER & FILTER SECTION -->
    <div class="bg-blue-900 p-6 text-white flex flex-col md:flex-row justify-between items-center gap-4 rounded-2xl shadow-xl">
      <div>
        <h1 class="text-2xl font-bold tracking-wide">📊 DASHBOARD LAPORAN LOG HISTORY</h1>
        <p class="text-blue-200 text-sm mt-1">Sistem Monitoring Presensi Real-Time Bubugao x BTN</p>
      </div>
      
      <div class="flex flex-wrap items-center gap-3">
        <!-- Dropdown Filter Tanggal -->
        <div class="flex items-center gap-2 bg-blue-800 p-2 rounded-xl border border-blue-700">
          <label class="text-sm font-semibold whitespace-nowrap">Filter Tanggal:</label>
          <select id="filterTanggal" class="bg-white text-gray-800 rounded-lg px-3 py-1.5 text-sm font-medium outline-none cursor-pointer min-w-[140px]">
            <option value="ALL">Semua Tanggal</option>
          </select>
        </div>

        <!-- Tombol Refresh Manual -->
        <button onclick="ambilData()" class="bg-blue-700 hover:bg-blue-600 active:scale-95 text-white text-sm font-bold px-4 py-2 rounded-xl transition-all shadow-md flex items-center gap-1.5 cursor-pointer">
          🔄 Refresh
        </button>
      </div>
    </div>

    <!-- MAIN TABLE CARD -->
    <div class="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden flex flex-col">
      <div class="bg-gray-100 px-6 py-4 border-b border-gray-200 font-bold text-gray-700 flex justify-between items-center">
        <span class="text-base">📋 Rekap Log Kehadiran & Foto Bukti</span>
        <span id="totalDataBadge" class="text-xs bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-semibold">Total: 0 Data</span>
      </div>
      
      <div class="overflow-x-auto p-4">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr id="tableHeader" class="border-b-2 border-gray-200 text-gray-600 font-bold uppercase tracking-wider bg-gray-50">
              <th class="py-3 px-4">Tanggal</th>
              <th class="py-3 px-4">Waktu</th>
              <th class="py-3 px-4">Data Barcode</th>
              <th class="py-3 px-4 text-center">Foto Bukti</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="text-gray-700 divide-y divide-gray-100">
            <tr>
              <td colspan="4" class="text-center py-8 text-gray-400">⏳ Mengambil data dari server...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // URL API Deployment Google Apps Script Anda yang Baru
    const API_URL = "https://script.google.com/macros/s/AKfycbzdqBHUNutuuYhh1-e8r0UMBdcX9AyYfFL7SNnUViY0dUM8LtNCRVMM1_eeLvdi7kri/exec?action=laporan"; 
    
    let masterRows = [];
    let headers = [];

    async function ambilData() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Gagal terhubung dengan server Google API");
        
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        if (!Array.isArray(data) || data.length === 0) throw new Error("Data Sheet Kosong");
        
        headers = data[0]; 
        masterRows = data.slice(1); 
        
        // 1. Render Header Tabel
        const headerContainer = document.getElementById('tableHeader');
        if (headers.length >= 4) {
          headerContainer.innerHTML = `
            <th class="py-3 px-4">${headers[0] || 'Tanggal'}</th>
            <th class="py-3 px-4">${headers[1] || 'Waktu'}</th>
            <th class="py-3 px-4">${headers[2] || 'Data Barcode'}</th>
            <th class="py-3 px-4 text-center">${headers[3] || 'Foto Bukti'}</th>
          `;
        }

        // 2. Isi Dropdown Filter Tanggal (Kolom A / Index 0)
        const dropdown = document.getElementById('filterTanggal');
        const tanggalPilihanSebelumnya = dropdown.value;
        
        // Mengambil nilai unik Tanggal
        const tanggalUnik = [...new Set(masterRows.map(r => r[0]))].filter(t => t && t.trim() !== "" && t !== headers[0]);
        
        dropdown.innerHTML = `<option value="ALL">Semua Tanggal (${masterRows.length})</option>`;
        tanggalUnik.forEach(tgl => {
          dropdown.innerHTML += `<option value="${tgl}">${tgl}</option>`;
        });

        // Pertahankan nilai filter yang sedang dipilih jika ada
        if (tanggalPilihanSebelumnya && [...dropdown.options].some(o => o.value === tanggalPilihanSebelumnya)) {
          dropdown.value = tanggalPilihanSebelumnya;
        }

        // 3. Tampilkan Data Sesuai Filter
        terapkanFilter();

      } catch (error) {
        console.error(error);
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-red-500 font-semibold">⚠️ ${error.message}</td></tr>`;
      }
    }

    // Event listener saat filter dropdown diubah
    document.getElementById('filterTanggal').addEventListener('change', terapkanFilter);

    function terapkanFilter() {
      const pilihanTanggal = document.getElementById('filterTanggal').value;
      
      let dataTerfilter = masterRows;
      if (pilihanTanggal !== "ALL") {
        dataTerfilter = masterRows.filter(r => r[0] === pilihanTanggal);
      }

      // Update Badge Total Data
      document.getElementById('totalDataBadge').innerText = `Total: ${dataTerfilter.length} Data`;

      // Render Isi Tabel
      renderTabel(dataTerfilter);
    }

    function renderTabel(dataBaris) {
      const tbody = document.getElementById('tableBody');
      
      if (dataBaris.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-gray-400">Tidak ada data presensi ditemukan.</td></tr>`;
        return;
      }
      
      // Tampilkan data urut dari yang paling baru (teratas)
      const dataReversed = [...dataBaris].reverse();

      tbody.innerHTML = dataReversed.map(row => {
        const tanggal = row[0] || '-';
        const waktu = row[1] || '-';
        const barcode = row[2] || '-';
        const linkFoto = row[3] || '';

        // Format kolom foto bukti menjadi tombol yang menarik
        let fotoCell = `<span class="text-gray-400 italic">Tidak Ada</span>`;
        if (linkFoto.startsWith('http://') || linkFoto.startsWith('https://')) {
          fotoCell = `
            <a href="${linkFoto}" target="_blank" 
               class="inline-flex items-center gap-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-3 py-1 rounded-lg text-xs font-bold transition-all">
               🖼️ Lihat Foto
            </a>
          `;
        }

        return `
          <tr class="hover:bg-blue-50/50 transition-colors border-b border-gray-100">
            <td class="py-3 px-4 font-medium text-gray-800">${tanggal}</td>
            <td class="py-3 px-4 text-gray-600">${waktu}</td>
            <td class="py-3 px-4 font-mono font-bold text-blue-900">${barcode}</td>
            <td class="py-3 px-4 text-center">${fotoCell}</td>
          </tr>
        `;
      }).join('');
    }

    // Jalankan penarikan data pertama kali
    ambilData();

    // Auto Refresh setiap 10 detik agar data log ter-update otomatis
    setInterval(ambilData, 10000);
  </script>
</body>
</html>
