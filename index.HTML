<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Laporan Realtime - Presensi BU BU GAO</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style> 
    body { background-color: #f3f4f6; } 
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
    <!-- Header Section -->
    <div class="bg-blue-900 p-6 text-white flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-wide">📋 LAPORAN LOG HISTORY</h1>
        <p class="text-blue-200 text-sm mt-1">
          Presensi BU BU GAO • 
          <span class="text-emerald-400 font-semibold animate-pulse">● Auto-Refresh Aktif</span>
          <span id="refreshTime" class="block text-xs text-blue-300 mt-0.5 font-mono">Menghubungkan ke server...</span>
        </p>
      </div>
      
      <!-- Filter & Fitur Tarik Data -->
      <div class="flex flex-wrap items-center gap-3 bg-blue-800 p-2 rounded-xl border border-blue-700">
        <div class="flex items-center gap-2">
          <label for="filterDropdown" class="text-sm font-semibold whitespace-nowrap">Filter Tanggal:</label>
          <select id="filterDropdown" class="bg-white text-gray-800 rounded-lg px-3 py-1.5 text-sm font-medium outline-none cursor-pointer min-w-[150px]">
            <option value="ALL">Memuat...</option>
          </select>
        </div>
        
        <!-- Tombol Tarik Data Hasil Filter -->
        <button id="downloadBtn" onclick="tarikDataHasilFilter()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1.5 transition-all shadow-md cursor-pointer active:scale-95">
          📥 Tarik Data
        </button>
      </div>
    </div>

    <!-- Tabel Laporan -->
    <div class="overflow-x-auto p-6">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr id="tableHeader" class="border-b-2 border-gray-200 text-gray-600 text-sm font-bold uppercase tracking-wider bg-gray-50">
            <th class="py-3 px-4">Tanggal</th>
            <th class="py-3 px-4">Waktu</th>
            <th class="py-3 px-4">Data Barcode</th>
            <th class="py-3 px-4 text-center">Foto Bukti</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="text-gray-700 text-sm divide-y divide-gray-100">
          <tr>
            <td colspan="4" class="text-center py-10 text-gray-400 font-medium animate-pulse">⏳ Menarik data laporan...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // URL API Google Apps Script Baru (LOG_HISTORY Kolom A-D)
    const API_URL = "https://script.google.com/macros/s/AKfycbzdqBHUNutuuYhh1-e8r0UMBdcX9AyYfFL7SNnUViY0dUM8LtNCRVMM1_eeLvdi7kri/exec?action=laporan"; 
    
    // Jeda waktu refresh otomatis (10000 milidetik = 10 detik)
    const REFRESH_INTERVAL = 10000; 

    let masterRows = [];
    let currentHeaders = [];
    let filterTerpilih = "ALL"; // Default tampilkan semua tanggal

    async function ambilData(isInitial = false) {
      try {
        // Anti-Cache timestamp agar selalu mengambil data paling baru dari server
        const urlDenganAntiCache = API_URL + "&_t=" + Date.now();

        const response = await fetch(urlDenganAntiCache);
        if (!response.ok) throw new Error("Gagal terhubung ke server API Google");

        const data = await response.json();
        if (data.error) throw new Error(data.error);
        if (!Array.isArray(data) || data.length === 0) throw new Error("Data sheet LOG_HISTORY kosong");
        
        currentHeaders = data[0]; 
        masterRows = data.slice(1);  
        
        // Render nama judul kolom ke tabel (Kolom A - D)
        const headerEl = document.getElementById('tableHeader');
        if (currentHeaders.length >= 4) {
          headerEl.innerHTML = `
            <th class="py-3 px-4">${currentHeaders[0] || 'Tanggal'}</th>
            <th class="py-3 px-4">${currentHeaders[1] || 'Waktu'}</th>
            <th class="py-3 px-4">${currentHeaders[2] || 'Data Barcode'}</th>
            <th class="py-3 px-4 text-center">${currentHeaders[3] || 'Foto Bukti'}</th>
          `;
        }
        
        // Ambil list tanggal unik dari Kolom A (Index 0)
        const tanggalUnik = [...new Set(masterRows.map(r => r[0]))].filter(t => t !== undefined && t !== null && t.toString().trim() !== "");
        
        const dropdown = document.getElementById('filterDropdown');
        
        // Opsi dasar "Semua Tanggal"
        let dropdownHtml = `<option value="ALL">Semua Tanggal (${masterRows.length})</option>`;
        tanggalUnik.forEach(tgl => {
          dropdownHtml += `<option value="${tgl}">${tgl}</option>`;
        });

        dropdown.innerHTML = dropdownHtml;

        // Pertahankan opsi filter yang sedang dipilih user
        if (filterTerpilih !== "ALL" && tanggalUnik.includes(filterTerpilih)) {
          dropdown.value = filterTerpilih;
        } else {
          filterTerpilih = "ALL";
          dropdown.value = "ALL";
        }

        // Tampilkan data sesuai filter yang aktif
        prosesFilter();

        // Update jam/waktu auto-refresh
        const skrg = new Date();
        const jam = String(skrg.getHours()).padStart(2, '0');
        const menit = String(skrg.getMinutes()).padStart(2, '0');
        const detik = String(skrg.getSeconds()).padStart(2, '0');
        document.getElementById('refreshTime').innerText = `Terakhir diperbarui: Pukul ${jam}:${menit}:${detik} WIB`;

      } catch (error) {
        console.error("Gagal memperbarui data:", error.message);
        document.getElementById('refreshTime').innerText = `⚠️ Koneksi terputus, mencoba ulang...`;
        if (isInitial) {
          document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" class="text-center py-10 text-red-500 font-bold">❌ Gagal memuat data: ${error.message}</td></tr>`;
        }
      }
    }

    function prosesFilter() {
      let dataFiltered = masterRows;
      if (filterTerpilih !== "ALL") {
        dataFiltered = masterRows.filter(r => r[0] === filterTerpilih);
      }
      tampilkanTabel(dataFiltered);
    }

    function tampilkanTabel(dataBaris) {
      const tbody = document.getElementById('tableBody');
      if (dataBaris.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-10 text-gray-400">Tidak ada data untuk filter ini.</td></tr>`;
        return;
      }

      // Tampilkan data dari yang paling terbaru (urutan terbalik)
      const dataReversed = [...dataBaris].reverse();

      tbody.innerHTML = dataReversed.map(row => {
        const tanggal = row[0] !== undefined ? row[0] : '-';
        const waktu = row[1] !== undefined ? row[1] : '-';
        const barcode = row[2] !== undefined ? row[2] : '-';
        const linkFoto = row[3] !== undefined ? row[3].toString() : '';

        // Format kolom Foto Bukti (Index 3)
        let fotoCell = `<span class="text-gray-400 italic">Tidak Ada</span>`;
        if (linkFoto.startsWith('http://') || linkFoto.startsWith('https://')) {
          fotoCell = `
            <a href="${linkFoto}" target="_blank" 
               class="inline-flex items-center gap-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-3 py-1 rounded-lg text-xs font-bold transition-all">
               🖼️ Lihat Foto
            </a>
          `;
        }

        return `
          <tr class="hover:bg-blue-50/40 transition-colors border-b border-gray-100">
            <td class="py-3 px-4 font-medium text-gray-800">${tanggal}</td>
            <td class="py-3 px-4 text-gray-600">${waktu}</td>
            <td class="py-3 px-4 font-mono font-bold text-blue-900">${barcode}</td>
            <td class="py-3 px-4 text-center">${fotoCell}</td>
          </tr>
        `;
      }).join('');
    }

    // FUNGSI TARIK DATA (DOWNLOAD CSV HASIL FILTER)
    function tarikDataHasilFilter() {
      if (masterRows.length === 0) {
        alert("Data belum siap atau tidak tersedia untuk diunduh!");
        return;
      }

      let dataDisaring = masterRows;
      let namaFile = "Laporan_Log_History_Semua.csv";

      if (filterTerpilih !== "ALL") {
        dataDisaring = masterRows.filter(r => r[0] === filterTerpilih);
        namaFile = `Laporan_Log_History_${filterTerpilih.replace(/[^a-zA-Z0-9]/g, "_")}.csv`;
      }

      const kontenCSV = [currentHeaders, ...dataDisaring]
        .map(baris => baris.map(cell => `"${(cell !== undefined && cell !== null ? cell : "").toString().replace(/"/g, '""')}"`).join(","))
        .join("\n");

      const blob = new Blob(["\uFEFF" + kontenCSV], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", namaFile);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Tangkap perubahan ketika user memilih tanggal di dropdown
    document.getElementById('filterDropdown').addEventListener('change', function() {
      filterTerpilih = this.value;
      prosesFilter();
    });

    // Panggilan pertama saat halaman dibuka
    ambilData(true);

    // Loop Auto-Refresh Berantai (setiap 10 detik)
    function mulaiSiklusAutoRefresh() {
      setTimeout(async () => {
        await ambilData(false); 
        mulaiSiklusAutoRefresh();
      }, REFRESH_INTERVAL);
    }

    mulaiSiklusAutoRefresh();
  </script>
</body>
</html>
